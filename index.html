<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kataki Store</title>
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Tajawal:wght@400;500;700&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#f3f5ee;--ink:#16200f;--mute:#5b6652;--line:#e1e6d8;--grad:linear-gradient(100deg,#7ed10c,#ffe51a);--nav:#14250c}
:root[data-theme=dark]{--bg:#10140c;--soft:#182011;--ink:#f1f5e8;--mute:#a3ad96;--line:#2a3420}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.7;padding-top:env(safe-area-inset-top,0)}
h1,h2,h3,b,button{font-family:"Readex Pro",Tahoma,sans-serif}
button{cursor:pointer;border:0;font-size:1rem}
a{color:inherit}
:focus-visible{outline:3px solid #5aa000;outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--nav);color:#fff;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:1.1rem;margin-inline-end:6px}
.lg img{width:42px;height:42px;border-radius:50%}
.sp{flex:1}
.ib{background:rgba(255,255,255,.14);color:#fff;padding:6px 12px;border-radius:99px;text-decoration:none;white-space:nowrap}
.cartbtn,.add{background:var(--grad);background-size:200% 100%;color:#16200f;padding:9px 18px;border-radius:99px;font-weight:700;transition:background-position .4s}
.cartbtn:hover,.add:hover{background-position:100% 0}
.cartbtn b{background:#16200f;color:#fff;border-radius:99px;padding:0 8px;margin-inline-start:6px}
.wrap,main{max-width:1100px;margin:0 auto;padding:0 16px 48px}
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin:14px 0 6px;padding:18px 26px;border-radius:18px;border:1px solid var(--line);background:radial-gradient(circle at 12% 50%,rgba(255,229,26,.28),transparent 55%),var(--soft)}
.hero h1{font-size:clamp(1.45rem,3.6vw,2.3rem);line-height:1.25;margin:0 0 6px;animation:rise .7s both}
.hero p{color:var(--mute);font-size:1.02rem;margin:0;animation:rise .7s .15s both}
.ring{position:relative;width:clamp(78px,20vw,140px);aspect-ratio:1;margin:8px;animation:float 4.5s ease-in-out infinite}
.ring::before{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(#7ed10c,#ffe51a,#7ed10c);animation:spin 7s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.ring img{position:relative;width:100%;height:100%;border-radius:50%;background:#fff}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-12px)}}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes bump{50%{transform:scale(1.6)}}@keyframes slide{from{transform:translateX(100%)}}
.bump{animation:bump .35s}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 18px}
.bar h2{margin:0;margin-inline-end:auto}
.chip{background:var(--soft);color:var(--ink);padding:6px 16px;border-radius:99px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.p{border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;animation:pop .5s calc(var(--i)*60ms) both;transition:transform .25s,box-shadow .25s}
.p:hover{transform:translateY(-6px);box-shadow:0 16px 30px rgba(90,160,0,.2)}
.dim{opacity:.5}
.art{background:#fff;aspect-ratio:1}
.art img{width:100%;height:100%;object-fit:contain;transition:transform .4s}
.p:hover .art img{transform:scale(1.07)}
.info{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.info small,.note{color:var(--mute);font-size:.88rem}
.info h3{margin:0;font-size:1.02rem}
.price{font-weight:700}.price s{color:var(--mute);font-weight:400;font-size:.9rem}
.add:disabled{opacity:.5}
.info .add{margin-top:auto;border-radius:12px}
select,input,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=checkbox],input[type=radio]{width:auto}
.drawer{position:fixed;inset:0;z-index:10;display:none}.drawer.open{display:block}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.panel{position:absolute;top:0;bottom:0;inset-inline-start:0;width:min(440px,100%);background:var(--bg);padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.drawer.open .panel{animation:slide .3s ease-out}
.row{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px}
.row img{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:8px}
.row>div:nth-child(2){flex:1}
.q{display:flex;gap:6px;align-items:center}
.q button{min-width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--ink);padding:0 8px}
.sum{display:flex;justify-content:space-between;gap:10px}
.sum.t{font-weight:700;font-size:1.1rem}
.pay label,.ck,.rt{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pay label{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.rt input{width:110px}
.card2{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.card2 h3{margin:0}
.oc{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:4px}
.pv{width:90px;border-radius:8px;background:#fff}
.close{background:none;color:var(--mute);padding:4px 0;align-self:flex-start}
.msg{color:#d33;min-height:1.3em;font-size:.9rem}
.empty{color:var(--mute);text-align:center;padding:30px 0}
footer{background:var(--soft);text-align:center;padding:22px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mc{background:var(--soft);color:var(--ink);border-radius:14px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s}
.mc:hover{transform:translateY(-3px)}.mc span{font-size:1.7rem}
.sr{flex:1;min-width:180px;display:flex;background:#fff;border-radius:10px;overflow:hidden}
.sr input{border:0;border-radius:0;background:#fff;color:#16200f;flex:1;min-width:0}
.sr button{background:var(--grad);color:#16200f;padding:0 16px;border-radius:0}
.cats{background:#1f3a12;display:flex;gap:6px;overflow-x:auto;padding:6px 16px}
.cats button{background:none;color:#fff;padding:4px 14px;border-radius:99px;white-space:nowrap}
.cats button[aria-pressed=true]{background:rgba(255,255,255,.22);font-weight:700}
.off{background:#e11d48;color:#fff;border-radius:6px;padding:0 6px;font-size:.8rem;font-weight:700}
.gbtn{background:#fff;color:#16200f;border:1px solid var(--line);border-radius:99px;padding:10px;font-weight:700}
.hb{display:flex;gap:6px;align-items:center}
.sr{max-width:640px}
@media(max-width:760px){.lg{flex:1}.hb{order:2}.sr{order:3;flex-basis:100%;max-width:none}.ord,.tx{display:none}}
@media(max-width:760px){.hero{padding:14px 16px;gap:12px}}
.mapp{width:min(580px,100%)}
#map{height:min(58vh,480px);border-radius:12px;border:1px solid var(--line);z-index:0}
.sr2{display:flex;gap:6px}.sr2 input{flex:1;min-width:0}
.pin{font-size:30px;line-height:30px;text-align:center;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.mbtn{background:var(--bg);border:2px dashed #5aa000;color:var(--ink);border-radius:12px;padding:10px;font-weight:700}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.info{padding:10px}.info h3{font-size:.92rem}.info .add{padding:9px 4px;font-size:.88rem}.p select{padding:6px;font-size:.88rem}.price{font-size:1rem}}
footer a{color:var(--ink);font-weight:700;text-decoration:none;margin:0 8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.btns{display:flex;gap:8px}.btns button{flex:1;padding:9px 6px;border-radius:99px;font-weight:700;min-width:0}
.buy{background:var(--nav);color:#fff;border:2px solid var(--nav);transition:transform .15s}.buy:hover{transform:translateY(-2px)}
.buyp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start;margin-top:14px}
@media(max-width:760px){.buyp{grid-template-columns:1fr}}
.buyp .pimg{border-radius:18px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}.buyp .pimg img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.buyp .fm{display:flex;flex-direction:column;gap:10px}
.qty{display:flex;align-items:center;gap:12px}.qty button{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.back{background:none;color:var(--mute);padding:6px 0;text-decoration:underline}
/* نجاح الطلب */
.ok{position:relative;text-align:center;padding:26px 8px 10px;overflow:hidden}
.ok svg{width:120px;height:120px}
.ok .ring2{fill:none;stroke:url(#okg);stroke-width:6;stroke-linecap:round;stroke-dasharray:302;stroke-dashoffset:302;animation:dr .8s .1s ease-out forwards;transform:rotate(-90deg);transform-origin:50% 50%}
.ok .tick{fill:none;stroke:#5aa000;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .5s .8s ease-out forwards}
.ok h2{animation:rise .6s 1s both;margin:6px 0}.ok .det{animation:rise .6s 1.2s both}
.ok .pk{display:inline-block;font-size:2.2rem;animation:pk 1s .3s both}
.cf{position:absolute;top:30%;left:50%;width:9px;height:14px;border-radius:2px;opacity:0;animation:cf 1.6s var(--d) ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes cf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@keyframes pk{0%{transform:translateY(-40px) scale(.4);opacity:0}60%{transform:translateY(6px) scale(1.1);opacity:1}100%{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.ok .ring2,.ok .tick{animation:none;stroke-dashoffset:0}.ok h2,.ok .det,.ok .pk{animation:none}.cf{display:none}}

/* نموذج الدخول */
.auw{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 30%,#14260c,#070d05);;animation:fadein .25s both;overflow-y:auto}
@keyframes fadein{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.au{direction:ltr;position:relative;width:min(780px,100%);min-height:470px;background:var(--bg);color:var(--ink);border-radius:16px;overflow:hidden;border:1px solid #d5dccf;box-shadow:0 0 0 3px rgba(255,255,255,.18),0 30px 80px rgba(0,0,0,.55);animation:pop .45s cubic-bezier(.2,1.1,.3,1) both}
.au .fp{position:absolute;top:0;left:0;width:50%;height:100%;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:24px 40px;direction:rtl;text-align:center;transition:transform .75s cubic-bezier(.65,0,.35,1),opacity .5s}
.au .fp h2{margin:0 0 4px;font-size:1.9rem;font-weight:700}
.au .fp input{background:var(--soft);border-color:transparent;padding:11px 12px;border-radius:6px;font-size:.92rem}
.au .fp input:focus{outline:2px solid #7ed10c;background:var(--bg)}
.au .si{z-index:2}.au .su{opacity:0;z-index:1;pointer-events:none}
.au.up .si{transform:translateX(100%);opacity:0;pointer-events:none}
.au.up .su{transform:translateX(100%);opacity:1;z-index:5;pointer-events:auto}
.au .ov{position:absolute;top:0;left:50%;width:50%;height:100%;overflow:hidden;z-index:10;transition:transform .75s cubic-bezier(.65,0,.35,1),border-radius .75s;border-radius:150px 0 0 150px;background:linear-gradient(135deg,#3f9b0b 0%,#7ed10c 55%,#d8e61a 100%);color:#10200a}
.au.up .ov{transform:translateX(-100%);border-radius:0 150px 150px 0}
.au .oc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;direction:rtl;text-align:center;transition:opacity .45s .15s,transform .75s cubic-bezier(.65,0,.35,1)}
.au .oc h2{margin:0;font-size:1.9rem;font-weight:700}.au .oc p{margin:0;max-width:250px;font-size:.88rem}
.au .oc.b{opacity:0;transform:translateX(-30%);pointer-events:none}.au.up .oc.a{opacity:0;transform:translateX(30%);pointer-events:none}.au.up .oc.b{opacity:1;transform:none;pointer-events:auto}
.au .ghost{background:transparent;border:1px solid #10200a;color:#10200a;border-radius:8px;padding:9px 34px;font-weight:700;font-size:.85rem;letter-spacing:.3px;transition:background .2s,color .2s}
.au .ghost:hover{background:#10200a;color:#fff}
.au .soc{display:flex;justify-content:center;gap:10px}.au .sbtn{width:40px;height:40px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s,box-shadow .15s}.au .sbtn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.16)}.au .fl{background:none;color:var(--mute);font-size:.85rem;text-decoration:none;padding:2px}.au .fl:hover{color:var(--ink);text-decoration:underline}.au .or{font-size:.82rem}.au .gbtn2{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:10px;font-weight:700;transition:transform .15s,box-shadow .15s}
.au .gbtn2:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.14)}
.au .or{color:var(--mute);font-size:.82rem}
.au .go{background:linear-gradient(135deg,#3f9b0b,#7ed10c);color:#fff;padding:10px 40px;border-radius:8px;font-weight:700;align-self:center;margin-top:4px;transition:background-position .4s}.au .go:hover{background-position:100% 0}
.au .x{position:absolute;top:10px;right:10px;z-index:20;width:34px;height:34px;border-radius:50%;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:1.2rem;line-height:1;display:flex;align-items:center;justify-content:center}
.au .mtog{display:none;background:none;color:var(--mute);text-decoration:underline;padding:6px}
@media(max-width:720px){
 .au{min-height:0;direction:rtl}
 .au .fp{position:static;width:100%;height:auto;transform:none!important;transition:none;padding:46px 22px 24px;animation:fadein .4s both}
 .au .su,.au.up .si{display:none}.au.up .su{display:flex}
 .au .su{opacity:1;pointer-events:auto}.au .ov{display:none}.au .mtog{display:block}
 .au .x{right:auto;left:10px}
}
@media(prefers-reduced-motion:reduce){.au,.auw,.au .fp,.au .ov,.au .oc{animation:none;transition:none}}

/* ===== واجهة المتجر ===== */
:root{--sun:#ffe51a;--lime:#7ed10c;--lime-d:#3f9b0b;--ink2:#2c3a22;--r:12px}
body{font-family:"IBM Plex Sans Arabic",Tajawal,Tahoma,sans-serif;line-height:1.65;font-size:16px}
h1,h2,h3,b,button{font-family:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ann{background:var(--nav);color:#e8f3d8;font-size:.84rem;text-align:center;padding:7px 16px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
.ann span{display:inline-flex;align-items:center;gap:6px}.ann .ic{width:15px;height:15px;color:var(--sun)}
header{position:sticky;top:0;z-index:5;background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line);padding:12px max(16px,calc((100% - 1180px)/2));gap:16px;flex-wrap:nowrap}
.lg{font-size:1.15rem;margin:0;flex:none}.lg img{width:44px;height:44px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--lime)}
.sr{position:relative;flex:1;max-width:560px;margin-inline:auto;background:var(--soft);border:1px solid transparent;border-radius:99px;overflow:hidden;align-items:center;transition:border-color .2s,background .2s}
.sr:focus-within{border-color:var(--lime);background:var(--bg)}
.sr .sic{position:absolute;inset-inline-start:14px;color:var(--mute);pointer-events:none}
.sr input{background:transparent;color:var(--ink);padding:11px 14px 11px 8px;padding-inline-start:44px;font-size:.95rem}
.sr input:focus{outline:none}
.sr button{background:none;color:var(--ink);font-weight:600;padding:0 18px;font-size:.9rem}
.hb{gap:4px}
.ib{background:none;color:var(--ink);padding:8px 12px;border-radius:99px;display:inline-flex;align-items:center;gap:7px;font-size:.92rem;font-weight:500}
.ib:hover{background:var(--soft)}
.cartbtn{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;display:inline-flex;align-items:center;gap:8px;margin-inline-start:6px}
.cartbtn:hover{background:var(--lime-d);color:#fff}
.cartbtn b{background:var(--sun);color:#16200f;margin:0;min-width:22px;text-align:center}
.cats{background:var(--bg);border-bottom:1px solid var(--line);padding:8px max(16px,calc((100% - 1180px)/2));gap:8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{color:var(--ink);background:var(--soft);padding:7px 18px;font-weight:500;font-size:.92rem;transition:background .2s,color .2s}
.cats button:hover{background:var(--line)}
.cats button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
main{max-width:1180px}
.hero2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(16px,4vw,56px);align-items:center;margin:26px 0 38px;padding:clamp(20px,4vw,46px);border-radius:28px;background:linear-gradient(120deg,#e9f7c9 0%,#f6f9d6 55%,#fff7a8 100%);color:#12200a;overflow:hidden;position:relative}
:root[data-theme=dark] .hero2{background:linear-gradient(120deg,#1d2f10,#26340f 60%,#3a3a0e);color:#f1f5e8}
.hero2 h1{font-size:clamp(1.9rem,4.6vw,3.3rem);line-height:1.18;margin:0 0 14px;font-weight:700;text-wrap:balance}
.hero2 p{margin:0 0 22px;font-size:1.08rem;max-width:30em;opacity:.82}
.hc{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:26px}
.hero2 .big{background:#12200a;color:#fff;padding:14px 30px;border-radius:99px;font-weight:600;font-size:1.02rem;transition:transform .2s,background .2s}
.hero2 .big:hover{background:var(--lime-d);transform:translateY(-2px)}
.hero2 .sec{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:5px;padding:10px 4px}
.trust{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;font-size:.92rem}
.trust li{display:flex;align-items:center;gap:9px}.trust .ic{color:var(--lime-d);width:22px;height:22px}
:root[data-theme=dark] .trust .ic{color:var(--sun)}
.hv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;direction:ltr}
.arch{margin:0;border-radius:999px 999px 20px 20px;overflow:hidden;background:#fff;box-shadow:0 18px 40px rgba(40,70,0,.18);animation:archin .9s cubic-bezier(.2,.9,.3,1) both}
.arch img{display:block;width:100%;height:100%;object-fit:cover}
.arch.a0{aspect-ratio:3/5;animation-delay:.05s}.arch.a1{aspect-ratio:3/6.3;animation-delay:.2s}.arch.a2{aspect-ratio:3/5;animation-delay:.35s}
@keyframes archin{from{opacity:0;transform:translateY(60px)}}
@media(max-width:820px){.hero2{grid-template-columns:1fr;margin-top:16px;border-radius:22px}.hv{order:-1;max-width:420px;margin-inline:auto;width:100%}.trust{grid-template-columns:1fr 1fr}}
.shead{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:6px 0 16px;scroll-margin-top:130px}
.shead h2{margin:0;font-size:1.6rem}.shead .note{margin-inline-end:auto}
.shead select{width:auto;border-radius:99px;padding:8px 16px;background:var(--soft);border-color:transparent;font-size:.9rem}
.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px 18px}
.p{border:0;border-radius:var(--r);background:transparent;overflow:visible;animation:none;transition:none}
.p:hover{transform:none;box-shadow:none}
.art{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--soft)}

function trTree(n){
 if(inOb(n))return;

 if(n.nodeType!==1||/^(SCRIPT|STYLE)$/.test(n.tagName))return;

 while(c=w.nextNode()){if(inOb(c))continue;if(c.nodeType===3){const t=tr(c.nodeValue);if(t!==c.nodeValue)c.nodeValue=t}else if(!/^(SCRIPT|STYLE)$/.test(c.tagName))trAttr(c)}

/* علامات صح/غلط على خانات الطلب */
document.addEventListener("input",e=>{
 const t=e.target;if(!t.closest||!t.closest(".fm")||t.type==="radio")return;
 let ok=null;
 if(t.id==="cp"){const v=normPhone(t.value);ok=t.value?/^01[0125]\d{8}$/.test(v):null}
 else if(t.id==="cn")ok=t.value.trim().length>=3?true:(t.value?false:null);
 else if(t.id==="cv"||t.id==="cd")ok=t.value?txtOk(t.value,3):null;
 else if(t.id==="ca")ok=t.value?(txtOk(t.value,8)&&t.value.trim().split(/\s+/).length>=2):null;
 t.classList.toggle("okf",ok===true);t.classList.toggle("badf",ok===false);
});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="gov"&&t.closest(".fm"))t.classList.toggle("okf",!!t.value)});

 }catch(e){}
