<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#f3f5ee;--ink:#16200f;--mute:#5b6652;--line:#e1e6d8;--grad:linear-gradient(100deg,#7ed10c,#ffe51a);--nav:#14250c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10140c;--soft:#182011;--ink:#f1f5e8;--mute:#a3ad96;--line:#2a3420}}
:root[data-theme=dark]{--bg:#10140c;--soft:#182011;--ink:#f1f5e8;--mute:#a3ad96;--line:#2a3420}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.7;padding-top:env(safe-area-inset-top,0)}
h1,h2,h3,b,button{font-family:"Readex Pro",Tahoma,sans-serif}
button{cursor:pointer;border:0;font-size:1rem}
a{color:inherit}
:focus-visible{outline:3px solid #5aa000;outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--nav);color:#fff;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:1.1rem;margin-inline-end:6px}
.lg img{width:42px;height:42px;border-radius:50%}
.sp{flex:1}
.ib{background:rgba(255,255,255,.14);color:#fff;padding:6px 12px;border-radius:99px;text-decoration:none;white-space:nowrap}
.cartbtn,.add{background:var(--grad);background-size:200% 100%;color:#16200f;padding:9px 18px;border-radius:99px;font-weight:700;transition:background-position .4s}
.cartbtn:hover,.add:hover{background-position:100% 0}
.cartbtn b{background:#16200f;color:#fff;border-radius:99px;padding:0 8px;margin-inline-start:6px}
.wrap,main{max-width:1100px;margin:0 auto;padding:0 16px 48px}
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin:14px 0 6px;padding:18px 26px;border-radius:18px;border:1px solid var(--line);background:radial-gradient(circle at 12% 50%,rgba(255,229,26,.28),transparent 55%),var(--soft)}
.hero h1{font-size:clamp(1.45rem,3.6vw,2.3rem);line-height:1.25;margin:0 0 6px;animation:rise .7s both}
.hero p{color:var(--mute);font-size:1.02rem;margin:0;animation:rise .7s .15s both}
.ring{position:relative;width:clamp(78px,20vw,140px);aspect-ratio:1;margin:8px;animation:float 4.5s ease-in-out infinite}
.ring::before{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(#7ed10c,#ffe51a,#7ed10c);animation:spin 7s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.ring img{position:relative;width:100%;height:100%;border-radius:50%;background:#fff}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-12px)}}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes bump{50%{transform:scale(1.6)}}@keyframes slide{from{transform:translateX(100%)}}
.bump{animation:bump .35s}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 18px}
.bar h2{margin:0;margin-inline-end:auto}
.chip{background:var(--soft);color:var(--ink);padding:6px 16px;border-radius:99px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.p{border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;animation:pop .5s calc(var(--i)*60ms) both;transition:transform .25s,box-shadow .25s}
.p:hover{transform:translateY(-6px);box-shadow:0 16px 30px rgba(90,160,0,.2)}
.dim{opacity:.5}
.art{background:#fff;aspect-ratio:1}
.art img{width:100%;height:100%;object-fit:contain;transition:transform .4s}
.p:hover .art img{transform:scale(1.07)}
.info{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.info small,.note{color:var(--mute);font-size:.88rem}
.info h3{margin:0;font-size:1.02rem}
.price{font-weight:700}.price s{color:var(--mute);font-weight:400;font-size:.9rem}
.add:disabled{opacity:.5}
.info .add{margin-top:auto;border-radius:12px}
select,input,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=checkbox],input[type=radio]{width:auto}
.drawer{position:fixed;inset:0;z-index:10;display:none}.drawer.open{display:block}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.panel{position:absolute;top:0;bottom:0;inset-inline-start:0;width:min(440px,100%);background:var(--bg);padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.drawer.open .panel{animation:slide .3s ease-out}
.row{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px}
.row img{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:8px}
.row>div:nth-child(2){flex:1}
.q{display:flex;gap:6px;align-items:center}
.q button{min-width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--ink);padding:0 8px}
.sum{display:flex;justify-content:space-between;gap:10px}
.sum.t{font-weight:700;font-size:1.1rem}
.pay label,.ck,.rt{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pay label{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.rt input{width:110px}
.card2{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.card2 h3{margin:0}
.oc{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:4px}
.pv{width:90px;border-radius:8px;background:#fff}
.close{background:none;color:var(--mute);padding:4px 0;align-self:flex-start}
.msg{color:#d33;min-height:1.3em;font-size:.9rem}
.empty{color:var(--mute);text-align:center;padding:30px 0}
footer{background:var(--soft);text-align:center;padding:22px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mc{background:var(--soft);color:var(--ink);border-radius:14px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s}
.mc:hover{transform:translateY(-3px)}.mc span{font-size:1.7rem}
.sr{flex:1;min-width:180px;display:flex;background:#fff;border-radius:10px;overflow:hidden}
.sr input{border:0;border-radius:0;background:#fff;color:#16200f;flex:1;min-width:0}
.sr button{background:var(--grad);color:#16200f;padding:0 16px;border-radius:0}
.cats{background:#1f3a12;display:flex;gap:6px;overflow-x:auto;padding:6px 16px}
.cats button{background:none;color:#fff;padding:4px 14px;border-radius:99px;white-space:nowrap}
.cats button[aria-pressed=true]{background:rgba(255,255,255,.22);font-weight:700}
.off{background:#e11d48;color:#fff;border-radius:6px;padding:0 6px;font-size:.8rem;font-weight:700}
.gbtn{background:#fff;color:#16200f;border:1px solid var(--line);border-radius:99px;padding:10px;font-weight:700}
.hb{display:flex;gap:6px;align-items:center}
.sr{max-width:640px}
@media(max-width:760px){.lg{flex:1}.hb{order:2}.sr{order:3;flex-basis:100%;max-width:none}.ord,.tx{display:none}}
@media(max-width:760px){.hero{padding:14px 16px;gap:12px}}
.mapp{width:min(580px,100%)}
#map{height:min(58vh,480px);border-radius:12px;border:1px solid var(--line);z-index:0}
.sr2{display:flex;gap:6px}.sr2 input{flex:1;min-width:0}
.pin{font-size:30px;line-height:30px;text-align:center;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.mbtn{background:var(--bg);border:2px dashed #5aa000;color:var(--ink);border-radius:12px;padding:10px;font-weight:700}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.info{padding:10px}.info h3{font-size:.92rem}.info .add{padding:9px 4px;font-size:.88rem}.p select{padding:6px;font-size:.88rem}.price{font-size:1rem}}
footer a{color:var(--ink);font-weight:700;text-decoration:none;margin:0 8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.gal{display:flex;gap:8px;flex-wrap:wrap}.gi{position:relative}.gi button{position:absolute;top:-6px;inset-inline-end:-6px;width:22px;height:22px;border-radius:50%;background:#e11d48;color:#fff;padding:0;line-height:1;font-size:.9rem}.kps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kp{background:var(--soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px;animation:kin .6s both}.kp:nth-child(2){animation-delay:.07s}.kp:nth-child(3){animation-delay:.14s}.kp:nth-child(4){animation-delay:.21s}.kp:nth-child(5){animation-delay:.28s}.kp:nth-child(6){animation-delay:.35s}
.kp small{color:var(--mute)}.kp b{font-size:1.45rem;font-family:"Readex Pro",sans-serif}.kp span{font-size:.78rem;color:var(--mute)}
@keyframes kin{from{opacity:0;transform:translateY(16px) scale(.94)}}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:8px;direction:ltr}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bc i{display:block;width:100%;max-width:38px;height:var(--h);min-height:3px;border-radius:8px 8px 3px 3px;background:var(--grad);transform-origin:bottom;animation:grow .9s calc(var(--i)*.08s) cubic-bezier(.2,.9,.3,1) both}
.bc em{font-style:normal;font-size:.62rem;color:var(--mute)}.bc span{font-size:.72rem;color:var(--mute)}
@keyframes grow{from{transform:scaleY(0)}}
.wrap>h3,.card2,.oc,.row,.mc{animation:kin .5s both}

/* ===== لوحة المالك v2: أنيميشن ===== */
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--g1:#7ed10c;--g2:#ffe51a;--glow:rgba(126,209,12,.35)}
body{position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.28;pointer-events:none}
body::before{top:-18vmax;inset-inline-start:-14vmax;background:radial-gradient(circle,#7ed10c,transparent 65%);animation:blob1 16s ease-in-out infinite alternate}
body::after{bottom:-20vmax;inset-inline-end:-14vmax;background:radial-gradient(circle,#ffe51a,transparent 65%);animation:blob2 19s ease-in-out infinite alternate}
@keyframes blob1{to{transform:translate(18vmax,12vmax) scale(1.2)}}@keyframes blob2{to{transform:translate(-16vmax,-10vmax) scale(1.15)}}
header{background:linear-gradient(110deg,#0f1d08,#1b3a0b 50%,#0f1d08);background-size:220% 100%;animation:hbg 12s ease-in-out infinite alternate;box-shadow:0 6px 26px rgba(0,0,0,.25);overflow:hidden}
header::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,#7ed10c,#ffe51a,#7ed10c,transparent);background-size:200% 100%;animation:hline 3s linear infinite}
@keyframes hbg{to{background-position:100% 0}}@keyframes hline{to{background-position:-200% 0}}
.lg{position:relative}
.lg img{background:#000;box-shadow:0 0 0 2px #14250c,0 0 0 4px var(--g1);animation:lgpulse 3.2s ease-in-out infinite}
@keyframes lgpulse{50%{box-shadow:0 0 0 2px #14250c,0 0 0 5px var(--g2),0 0 22px var(--glow)}}
#sn{background:linear-gradient(100deg,#fff 30%,#ffe51a 50%,#fff 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 4s linear infinite}
@keyframes shim{to{background-position:-250% 0}}
.live{margin-inline-start:auto;display:inline-flex;align-items:center;gap:7px;font-size:.82rem;color:#d7f5a4;background:rgba(126,209,12,.14);border:1px solid rgba(126,209,12,.4);padding:3px 12px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:#7ed10c;box-shadow:0 0 0 0 rgba(126,209,12,.7);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(126,209,12,0)}100%{box-shadow:0 0 0 0 rgba(126,209,12,0)}}
/* ترحيب */
.hello{position:relative;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin:16px 0 18px;padding:22px 24px;border-radius:22px;background:linear-gradient(120deg,#142a0a,#244d10 60%,#3b7d0a);color:#fff;overflow:hidden;animation:pop .7s both;isolation:isolate}
.hello::before{content:"";position:absolute;inset:0;z-index:-1;background:conic-gradient(from var(--ang),transparent 0 70%,rgba(255,229,26,.55) 85%,transparent);animation:spinA 6s linear infinite;opacity:.55}
.hello::after{content:"";position:absolute;inset:2px;border-radius:20px;background:linear-gradient(120deg,#142a0a,#244d10 60%,#2f6a0a);z-index:-1}
@keyframes spinA{to{--ang:360deg}}
.hello h2{margin:0 0 4px;font-size:clamp(1.3rem,3.4vw,1.9rem)}
.hello p{margin:0;color:#cfe8ad}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.hmini{display:flex;gap:10px;flex-wrap:wrap}
.hm{min-width:96px;white-space:nowrap;text-align:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:10px 12px;backdrop-filter:blur(4px);animation:kin .6s both}
.hm:nth-child(2){animation-delay:.12s}.hm:nth-child(3){animation-delay:.24s}
.hm b{display:block;font-size:clamp(1.05rem,4.4vw,1.35rem);color:#ffe51a;white-space:nowrap}.hm small{color:#cfe8ad}
@media(max-width:700px){.hello{grid-template-columns:1fr}.hmini{justify-content:space-between}.hm{flex:1;min-width:0}}
/* بطاقات الأقسام */
.grid2{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;perspective:900px}
.mc{--h:90;position:relative;overflow:hidden;isolation:isolate;border:1px solid var(--line);background:var(--soft);padding:22px 10px 18px;border-radius:22px;gap:6px;opacity:0;animation:tin .6s calc(var(--i,0)*70ms) cubic-bezier(.2,1.2,.4,1) forwards;transition:transform .25s cubic-bezier(.2,1.4,.4,1),box-shadow .3s,border-color .3s;transform-style:preserve-3d;will-change:transform}
@keyframes tin{from{opacity:0;transform:translateY(30px) rotateX(-25deg) scale(.9)}to{opacity:1;transform:none}}
.mc::before{content:"";position:absolute;inset:-60%;z-index:-1;background:conic-gradient(from var(--ang),transparent 0 60%,hsl(var(--h) 80% 55%) 80%,transparent);opacity:0;transition:opacity .3s;animation:spinA 4s linear infinite}
.mc::after{content:"";position:absolute;inset:2px;border-radius:20px;background:var(--soft);z-index:-1}
.mc:hover::before,.mc:focus-visible::before{opacity:1}
.mc:hover{transform:translateY(-8px) scale(1.03);box-shadow:0 18px 36px hsl(var(--h) 70% 40%/.28)}
.mc span{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;font-size:1.9rem;background:linear-gradient(135deg,hsl(var(--h) 85% 62%),hsl(calc(var(--h) + 30) 90% 52%));box-shadow:0 10px 20px hsl(var(--h) 70% 45%/.35);animation:bob 3.6s calc(var(--i,0)*-.4s) ease-in-out infinite;transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.mc:hover span{transform:scale(1.18) rotate(-10deg);animation-play-state:paused}
@keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}
.mc b{font-size:1.02rem}.mc small{color:var(--mute)}
.mc .bdg{position:absolute;top:10px;inset-inline-end:10px;min-width:26px;height:26px;padding:0 8px;border-radius:99px;background:#e11d48;color:#fff;font-size:.8rem;font-weight:700;display:grid;place-items:center;animation:bdg 1.6s infinite}
@keyframes bdg{0%{box-shadow:0 0 0 0 rgba(225,29,72,.6)}70%,100%{box-shadow:0 0 0 12px rgba(225,29,72,0)}}
/* عنوان القسم */
.wrap>h3{display:flex;align-items:center;gap:12px;font-size:1.35rem;margin:6px 0 16px;position:relative;padding-bottom:10px}
.wrap>h3::after{content:"";position:absolute;bottom:0;inset-inline-start:0;height:4px;width:70px;border-radius:4px;background:var(--grad);animation:uw .8s cubic-bezier(.2,.9,.3,1) both}
@keyframes uw{from{width:0}}
.sic{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;font-size:1.4rem;background:linear-gradient(135deg,hsl(var(--h,90) 85% 62%),hsl(calc(var(--h,90) + 30) 90% 52%));box-shadow:0 8px 18px hsl(var(--h,90) 70% 45%/.3);animation:pop .6s both}
.bar{animation:kin .5s both}
.chip{transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s,box-shadow .2s;position:relative;overflow:hidden}
.chip:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.15)}
button{position:relative;overflow:hidden}
button:active:not(:disabled){transform:scale(.95)}
.add{position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(126,209,12,.35);transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,background-position .4s}
.add::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:swp 3.4s ease-in-out infinite}
@keyframes swp{0%,55%{left:-60%}100%{left:130%}}
.add:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(126,209,12,.5)}
.rpl{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rpl .6s ease-out forwards;pointer-events:none}
@keyframes rpl{to{transform:scale(4);opacity:0}}
/* كروت وصفوف */
.card2,.oc,.row{position:relative;transition:transform .25s,box-shadow .3s,border-color .3s;animation:kin .55s calc(var(--d,0)*55ms) cubic-bezier(.2,1,.3,1) both}
.card2:hover,.oc:hover,.row:hover{border-color:#7ed10c;box-shadow:0 10px 26px rgba(126,209,12,.18);transform:translateY(-3px)}
.row img{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}.row:hover img{transform:scale(1.12) rotate(-4deg)}
.oc{border-inline-start:5px solid var(--line)}
.oc[data-st="جديد"]{border-inline-start-color:#e11d48}.oc[data-st="تم التأكيد"]{border-inline-start-color:#f59e0b}.oc[data-st="تم الشحن"]{border-inline-start-color:#3b82f6}.oc[data-st="تم التسليم"]{border-inline-start-color:#7ed10c}.oc[data-st="ملغي"],.oc[data-st="مرتجع"]{border-inline-start-color:#8a8f84;opacity:.8}
.oc[data-st="جديد"]::before{content:"جديد";position:absolute;top:-12px;inset-inline-start:14px;background:#e11d48;color:#fff;border-radius:99px;padding:0 10px;font-size:.78rem;font-weight:700;animation:bdg 1.6s infinite}
input,select,textarea{transition:border-color .2s,box-shadow .25s,transform .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:#7ed10c;box-shadow:0 0 0 4px rgba(126,209,12,.22);transform:translateY(-1px)}
/* الدخول */
.wrap[style*="440px"]{padding-top:34px}
.wrap[style*="440px"] .card2{--ang:0deg;border:0;padding:26px 22px;background:var(--bg);box-shadow:0 20px 50px rgba(0,0,0,.18);animation:pop .7s both;overflow:visible}
.wrap[style*="440px"] .card2::before{content:"";position:absolute;inset:-3px;border-radius:17px;background:conic-gradient(from var(--ang),#7ed10c,#ffe51a,#7ed10c 60%,#ffe51a,#7ed10c);animation:spinA 5s linear infinite;z-index:-1}
.wrap[style*="440px"] .card2::after{content:"";position:absolute;inset:0;border-radius:14px;background:var(--bg);z-index:-1}
.wrap[style*="440px"] .card2:hover{transform:none;box-shadow:0 24px 60px rgba(126,209,12,.25)}
.wrap[style*="440px"] h2{text-align:center;font-size:1.5rem}
.wrap[style*="440px"] h2::before{content:"🔐";display:block;font-size:2.6rem;margin-bottom:4px;animation:bob 3s ease-in-out infinite}
.msg:not(:empty){animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* الإحصائيات */
.kp{position:relative;overflow:hidden;border:1px solid var(--line);transition:transform .25s,box-shadow .3s}
.kp:hover{transform:translateY(-5px);box-shadow:0 14px 28px rgba(126,209,12,.22)}
.kp::after{content:"";position:absolute;top:-40%;inset-inline-end:-20%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(126,209,12,.28),transparent 70%);animation:glow 4s ease-in-out infinite alternate}

const xe=s=>String(s??"").replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function crc32(b){let c,t=crc32.t;if(!t){t=crc32.t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipBytes(files){
 const enc=new TextEncoder(),u16=n=>[n&255,n>>8&255],u32=n=>[n&255,n>>8&255,n>>16&255,n>>>24&255],parts=[],cen=[];let off=0;
 files.forEach(([name,str])=>{
  const nb=enc.encode(name),db=enc.encode(str),crc=crc32(db);
  const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
  parts.push(lh,nb,db);
  cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
  off+=lh.length+nb.length+db.length;
 });
 const cs=cen.reduce((a,x)=>a+x.length,0);
 const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
 const all=[...parts,...cen,end],out=new Uint8Array(all.reduce((a,x)=>a+x.length,0));let p=0;all.forEach(x=>{out.set(x,p);p+=x.length});return out;
}
function buildXlsx(orders){
 const L=i=>String.fromCharCode(65+i),p2=n=>String(n).padStart(2,"0");
 const sc=(r,c,v,s)=>`<c r="${L(c)}${r}" t="inlineStr"${s?` s="${s}"`:""}><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
 const nc=(r,c,v,s)=>`<c r="${L(c)}${r}"${s?` s="${s}"`:""}><v>${Number(v)||0}</v></c>`;
 let rows=`<row r="1" ht="22" customHeight="1">${XCOLS.map((x,i)=>sc(1,i,x[0],1)).join("")}</row>`,sum=0,links=[];
 orders.forEach((o,k)=>{
  const r=k+2,d=new Date(o.created_at),ds=isNaN(d)?"":d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes());
  if(o.status!=="ملغي"&&o.status!=="مرتجع")sum+=Number(o.total)||0;
  let loc="";if(o.lat!=null&&o.lng!=null){const u="https://www.google.com/maps?q="+o.lat+","+o.lng;loc=sc(r,14,u);links.push([L(14)+r,u])}
  rows+=`<row r="${r}">${nc(r,0,o.id)}${sc(r,1,ds)}${sc(r,2,o.name,2)}${sc(r,3,o.phone)}${sc(r,4,o.governorate)}${sc(r,5,o.address,2)}${sc(r,6,o.notes,2)}${sc(r,7,(o.items||[]).map(i=>i.name+itl(i)+" × "+i.qty).join("\n"),2)}${nc(r,8,o.subtotal)}${nc(r,9,o.shipping)}${nc(r,10,o.total)}${sc(r,11,PAYAR[o.payment]||o.payment)}${sc(r,12,o.paid?"نعم":"لا")}${sc(r,13,o.status)}${loc}</row>`;
 });
 const n=orders.length,sr=n+3;
 rows+=`<row r="${sr}">${sc(sr,9,"الإجمالي (بدون الملغي والمرتجع)",1)}${nc(sr,10,sum,1)}</row>`;
 const ns='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"',rn='xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"',hd='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
 const HL=links.length?`<hyperlinks>${links.map((x,i)=>`<hyperlink ref="${x[0]}" r:id="rId${i+1}"/>`).join("")}</hyperlinks>`:"";
 const sheet=`${hd}<worksheet ${ns} ${rn}><sheetViews><sheetView rightToLeft="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${XCOLS.map((x,i)=>`<col min="${i+1}" max="${i+1}" width="${x[1]}" customWidth="1"/>`).join("")}</cols><sheetData>${rows}</sheetData><autoFilter ref="A1:${L(XCOLS.length-1)}${n+1}"/>${HL}</worksheet>`;
 const styles=`${hd}<styleSheet ${ns}><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDDF0B0"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
 const rel="http://schemas.openxmlformats.org/officeDocument/2006/relationships",pk="http://schemas.openxmlformats.org/package/2006/relationships",sm="application/vnd.openxmlformats-officedocument.spreadsheetml";
 return zipBytes([
  ["[Content_Types].xml",`${hd}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="${sm}.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="${sm}.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="${sm}.styles+xml"/></Types>`],
  ["_rels/.rels",`${hd}<Relationships xmlns="${pk}"><Relationship Id="rId1" Type="${rel}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
  ["xl/workbook.xml",`${hd}<workbook ${ns} ${rn}><sheets><sheet name="الطلبات" sheetId="1" r:id="rId1"/></sheets></workbook>`],
  ["xl/_rels/workbook.xml.rels",`${hd}<Relationships xmlns="${pk}"><Relationship Id="rId1" Type="${rel}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${rel}/styles" Target="styles.xml"/></Relationships>`],
  ["xl/styles.xml",styles],["xl/worksheets/sheet1.xml",sheet],
  ...(links.length?[["xl/worksheets/_rels/sheet1.xml.rels",`${hd}<Relationships xmlns="${pk}">${links.map((x,i)=>`<Relationship Id="rId${i+1}" Type="${rel}/hyperlink" Target="${xe(x[1])}" TargetMode="External"/>`).join("")}</Relationships>`]]:[])
 ]);
}

function shrink(file){return new Promise(r=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(r,"image/jpeg",.82)};im.src=URL.createObjectURL(file)})}
async function upImg(file){
 const path=Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg",{error}=await sb.storage.from("products").upload(path,await shrink(file),{contentType:"image/jpeg"});
 if(error)throw error;return sb.storage.from("products").getPublicUrl(path).data.publicUrl;
}

function szBlock(e){
 const m=S.pmode||modeOf(e),q=(e.sizes||{})[NOSZ]??"";
 const cat=e.category||"",pre=Object.keys(SZP).find(k=>cat.includes(k.slice(0,3)));

function autoMode(){
 if(!S.edit||S.pmanual)return;const w=document.getElementById("szwrap");if(!w)return;
 const c=document.getElementById("pc"),k=document.getElementById("pk");
 const none=NOSZ_RE.test(((c&&c.value)||"")+" "+((k&&k.value)||""));const m=none?"none":"sizes";
 if(w.dataset.mode!==m){w.dataset.mode=m;S.pmode=m;w.querySelectorAll(".mchips button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===m))}
 const cat=(c&&c.value)||"",pre=Object.keys(SZP).find(x=>cat.includes(x.slice(0,3)));

async function saveProd(){
 const e=S.edit,f=id=>$("#"+id).value.trim(),sizes={};
 Object.assign(sizes,readSizes());
 let img=e.img;const file=$("#pf").files[0];
 try{if(file)img=await upImg(file)}catch(x){amsg("فشل رفع الصورة.");return}
 let images=(e.images||[]).slice();
 try{for(const fl of Array.from($("#pf2").files||[]).slice(0,8))images.push(await upImg(fl))}catch(x){amsg("فشل رفع الصور الإضافية.");return}
 const colors=(e.colors||[]).slice(0,12),color_imgs=Object.fromEntries(Object.entries(e.color_imgs||{}).filter(([k,v])=>colors.includes(k)&&v));
 if(!f("pn")||!(+f("pp")>0)||!img){amsg("الاسم والسعر والصورة مطلوبين.");return}
 {const kk=f("pk"),cc=f("pc");if(kk){const same=S.prods.filter(p=>p.id!==e.id&&p.kind&&p.kind.trim()===kk),cs=[...new Set(same.map(p=>p.category))];
  if(same.length&&!cs.includes(cc)){const key=cc+"|"+kk;if(S.mmk!==key){S.mmk=key;amsg("«"+kk+"» غالباً بيتحط في قسم «"+cs.join("، ")+"». لو القسم «"+cc+"» صح اضغط حفظ تاني.");return}}}}
 if(!Object.keys(sizes).length){amsg("اكتب مقاس واحد على الأقل وكميته، أو اختار «من غير مقاس».");return}
 const row={name:f("pn"),category:f("pc"),kind:f("pk")||null,price:+f("pp"),old_price:+f("po")||null,img,images,colors,color_imgs,sizes,hidden:!!e.hidden};
 const {error}=await(e.id?sb.from("products").update(row).eq("id",e.id):sb.from("products").insert(row));
 if(error){amsg("تعذر الحفظ.");return}
 S.pmode=null;S.edit=null;await reloadProds();render();
}
async function saveSettings(){
 const d={...S.cfg};
 FLD.forEach(([k])=>{const v=$("#cf_"+k).value.trim();d[k]=k==="free_shipping_over"?Math.max(0,+v||0):v});
 d.return_policy=$("#cf_return_policy").value;
 Object.keys(PAYN).forEach(k=>d["pay_"+k]=$("#cf_pay_"+k).checked);
 d.login_google=$("#cf_login_google").checked;d.login_code=$("#cf_login_code").checked;
 if(d.pay_vodafone&&!d.vodafone_number){amsg("اكتب رقم فودافون كاش قبل تفعيله.");return}
 if(d.pay_instapay&&!d.instapay_address){amsg("اكتب عنوان إنستاباي قبل تفعيله.");return}
 const rates=S.rates.map((r,i)=>({governorate:r.governorate,price:Math.max(0,Math.round(+$("#rt"+i).value||0))}));
 const a=await sb.rpc("save_settings",{p_data:d});
 if(a.error){if(/stepup/.test(a.error.message)){stepUp(()=>saveSettings());return}amsg("تعذر الحفظ.");return}
 const b=await sb.from("shipping_rates").upsert(rates);
 if(b.error){amsg("اتحفظت الإعدادات لكن تعذر حفظ أسعار الشحن.");return}
 S.cfg=d;S.rates=rates;await loadAll();render();toast("تم حفظ الإعدادات ✓");
}

 await loadMe();
 if(!isStaff()){await sb.auth.signOut();S.me=null;view("login","الحساب ده مش من فريق المتجر.");return}
 await startPanel();return;
}
async function startEnroll(all){
 for(const x of all)if(x.factor_type==="totp"&&x.status!=="verified")await sb.auth.mfa.unenroll({factorId:x.id});
 const {data,error}=await sb.auth.mfa.enroll({factorType:"totp",friendlyName:"Kataki-"+Date.now()});
 if(error||!data){view("login","تعذر تفعيل كود الموبايل. تأكد إن MFA مفعّل في Supabase.");return}
 let qr=data.totp.qr_code||"";
 const raw=qr.replace(/^data:image\/svg\+xml;(?:charset=)?utf-?8,/i,"");
 if(raw.startsWith("<svg"))qr="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(raw);
 S.enroll={id:data.id,qr,secret:data.totp.secret};S.factor=data.id;view("enroll");
}
async function enter(factorId,code){
 const {error}=await sb.auth.mfa.challengeAndVerify({factorId,code});
 if(error)return error;
 const a=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
 if(!a.data||a.data.currentLevel!=="aal2")return {message:"aal"};
 return null;
}

function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=880;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.5);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.55);setTimeout(()=>c.close(),800)}catch(e){}}
async function liveTick(){
 if(S.view!=="panel"||document.hidden||!sb||S.busy)return;
 const tab=S.tab||"";if(!["","o","d"].includes(tab))return;
 let rows;try{rows=(await sb.from("orders").select("*").order("id",{ascending:false}).limit(tab==="d"?500:100)).data}catch(e){return}
 if(!rows)return;
 const sig=rows.map(o=>o.id+":"+o.status+":"+(o.paid?1:0)).join("|"),prev=S.orders.length?Math.max(...S.orders.map(o=>o.id)):0;
 if(sig===S.orders.map(o=>o.id+":"+o.status+":"+(o.paid?1:0)).join("|"))return;
 const fresh=rows.filter(o=>o.id>prev&&o.status==="جديد");
 S.orders=rows;
 const ae=document.activeElement;if(tab==="o"&&ae&&/^(SELECT|INPUT|TEXTAREA)$/.test(ae.tagName)){ }else{const y=scrollY;render();scrollTo(0,y)}
 if(fresh.length){beep();try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}toast("🔔 طلب جديد #"+fresh[0].id+" من "+fresh[0].name+(fresh.length>1?" (+"+(fresh.length-1)+")":""),4500)}
}
setInterval(liveTick,8000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)liveTick()});
